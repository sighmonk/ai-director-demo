name: Feature request
description: Propose a gameplay, AI Director, tooling or documentation change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or what should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the intended behaviour or design.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI Director
        - Dungeon generation
        - Gameplay / entities
        - Tests
        - CI/CD
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This change does not require committing secrets or local configuration.
          required: true
